name: ThinkMate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (dev + prod, allowlist in audit-allowlist.json)
        run: npm run audit:ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Publish Commit Status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          STATE="failure"
          if [ "$STATUS" = "success" ]; then
            STATE="success"
          fi
          curl --fail -sSL -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\": \"$STATE\", \"context\": \"ci/pipeline\", \"description\": \"Lint, Typecheck, Test & Build $STATE\"}" || {
              echo "Failed to publish commit status to GitHub API"
              exit 1
            }

  e2e-local:
    name: Browser E2E (local, mocked Supabase/Gemini)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
