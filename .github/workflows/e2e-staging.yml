name: Staging E2E

# Runs e2e/staging against a deployed app with real Supabase, Redis and Gemini.
# Configure repository secrets: E2E_BASE_URL, E2E_TEST_EMAIL, E2E_TEST_PASSWORD
# (a confirmed, dedicated test account on the staging project).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed app URL (defaults to the E2E_BASE_URL secret)'
        required: false
  schedule:
    - cron: '0 6 * * *'

jobs:
  staging-e2e:
    name: Browser E2E (deployed staging)
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || vars.E2E_BASE_URL || secrets.E2E_BASE_URL }}
      E2E_TEST_EMAIL: ${{ vars.E2E_TEST_EMAIL || secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Validate staging E2E configuration and credentials
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::error::Set the E2E_BASE_URL secret or pass base_url to run the staging suite."
            exit 1
          fi
          if [ -z "$E2E_TEST_EMAIL" ] || [ -z "$E2E_TEST_PASSWORD" ]; then
            echo "::error::E2E_TEST_EMAIL and E2E_TEST_PASSWORD are required to run staging browser E2E tests against real services."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run staging suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
