name: Staging Database Verification

on:
  workflow_dispatch:
  schedule:
    # Optional scheduled nightly run against staging environment
    - cron: '0 3 * * *'

jobs:
  verify-staging-database:
    name: Verify Database Concurrency & Migrations
    runs-on: ubuntu-latest
    environment: staging # Protected environment with staging-only secrets
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Release-Readiness Secrets Pre-Flight
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          EXPECTED_STAGING_PROJECT_REF: ${{ vars.EXPECTED_STAGING_PROJECT_REF || secrets.EXPECTED_STAGING_PROJECT_REF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== Validating Required Secrets for Release-Readiness Verification ==="
          MISSING=0
          if [ -z "$STAGING_SUPABASE_URL" ]; then echo "::error::Missing secret STAGING_SUPABASE_URL"; MISSING=1; fi
          if [ -z "$STAGING_SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::Missing secret STAGING_SUPABASE_SERVICE_ROLE_KEY"; MISSING=1; fi
          if [ -z "$STAGING_SUPABASE_ANON_KEY" ]; then echo "::error::Missing secret STAGING_SUPABASE_ANON_KEY"; MISSING=1; fi
          if [ -z "$EXPECTED_STAGING_PROJECT_REF" ]; then echo "::error::Missing secret/var EXPECTED_STAGING_PROJECT_REF"; MISSING=1; fi
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::Missing secret GEMINI_API_KEY. Live model and live MCP verification are mandatory."; MISSING=1; fi
          if [ "$MISSING" -ne 0 ]; then
            echo "Release-readiness verification failed pre-flight: required credentials missing. Failing closed."
            exit 1
          fi
          echo "All required staging and AI credentials verified."

      - name: Run Staging Verification Suite
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          EXPECTED_STAGING_PROJECT_REF: ${{ vars.EXPECTED_STAGING_PROJECT_REF || secrets.EXPECTED_STAGING_PROJECT_REF }}
        run: npx tsx scripts/verify-supabase-staging.ts

      - name: Run Staging RPC Concurrency & User-Level Lock Suite
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          EXPECTED_STAGING_PROJECT_REF: ${{ vars.EXPECTED_STAGING_PROJECT_REF || secrets.EXPECTED_STAGING_PROJECT_REF }}
        run: npx tsx scripts/verify-staging-rpc.ts

      - name: Run Cross-User RLS Isolation Suite
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: npx tsx scripts/rls-test.ts

      - name: Run Real-Model Extraction Verification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: npm run verify:extraction

      - name: Run Live MCP End-to-End Suite
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          EXPECTED_STAGING_PROJECT_REF: ${{ vars.EXPECTED_STAGING_PROJECT_REF || secrets.EXPECTED_STAGING_PROJECT_REF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          ALLOWED_ORIGINS: 'http://localhost:3000'
        run: npm run verify:mcp:live

      - name: Publish Staging Commit Status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          STATE="failure"
          if [ "$STATUS" = "success" ]; then
            STATE="success"
          fi
          curl --fail -sSL -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\": \"$STATE\", \"context\": \"staging/database-verification\", \"description\": \"Staging Database Verification $STATE\"}" || {
              echo "Failed to publish staging commit status to GitHub API"
              exit 1
            }
